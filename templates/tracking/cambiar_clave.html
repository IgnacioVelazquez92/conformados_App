{% extends "base.html" %}

{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <section class="brand-card bg-white p-0 overflow-hidden">
            <div class="p-4 border-bottom">
                <h1 class="h5 mb-0">Cambiar contraseña</h1>
            </div>
            <div class="p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        <input
                            type="password"
                            class="form-control{% if field.errors %} is-invalid{% endif %}"
                            id="{{ field.id_for_label }}"
                            name="{{ field.html_name }}"
                            autocomplete="{{ field.field.widget.attrs.autocomplete|default:'current-password' }}"
                        >
                        {% for error in field.errors %}
                            <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
                        <a href="/panel/" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
